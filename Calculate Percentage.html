<!DOCTYPE html>
<html lang="ar" dir="rtl" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم النسب المئوية | Percentage Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class', // تفعيل التبديل عبر الفئات (Class-based)
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Tajawal', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        /* تخصيص المظهر الزجاجي المتناسق مع الوضعين */
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .dark .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        /* الخلفيات المتحركة التفاعلية */
        body {
            background: linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 100%);
            min-height: 100vh;
            transition: background 0.3s ease;
        }
        body.dark {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        }

        /* إخفاء أسهم حقول الأرقام الافتراضية */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="font-sans text-slate-800 dark:text-slate-200 flex flex-col md:flex-row min-h-screen overflow-x-hidden">

    <aside class="w-full md:w-80 bg-slate-900 dark:bg-slate-950 text-slate-100 flex flex-col shadow-xl z-10 transition-all duration-300">
        <div class="p-6 border-b border-slate-800 dark:border-slate-900 bg-slate-950 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="p-2 bg-blue-600 rounded-lg text-white font-bold text-xl">%</div>
                <div>
                    <h1 class="text-lg font-bold text-white tracking-wide">لوحة النسب</h1>
                    <p class="text-xs text-slate-400">حسابات ذكية ومرنة</p>
                </div>
            </div>
            
            <button onclick="toggleDarkMode()" id="theme-toggle-btn" class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 transition-colors text-xl" title="تبديل الوضع">
                🌙
            </button>
        </div>
        
        <nav class="flex-1 p-4 space-y-1 overflow-y-auto max-h-[calc(100vh-85px)]" id="sidebar-menu">
            <button onclick="switchTab('vat')" id="btn-vat" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all duration-200 text-right bg-blue-600 text-white font-medium shadow-md">
                <span>💰</span> حساب ضريبة القيمة المضافة
            </button>
            <button onclick="switchTab('part-of-amount')" id="btn-part-of-amount" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all duration-200 text-right text-slate-300 hover:bg-slate-800 dark:hover:bg-slate-900 hover:text-white">
                <span>📊</span> قيمة النسبة من مبلغ
            </button>
            <button onclick="switchTab('change-rate')" id="btn-change-rate" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all duration-200 text-right text-slate-300 hover:bg-slate-800 dark:hover:bg-slate-900 hover:text-white">
                <span>🔄</span> حساب نسبة التغير
            </button>
            <button onclick="switchTab('original-number')" id="btn-original-number" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all duration-200 text-right text-slate-300 hover:bg-slate-800 dark:hover:bg-slate-900 hover:text-white">
                <span>🔍</span> معرفة العدد الأصلي
            </button>
            <button onclick="switchTab('ratio-of-value')" id="btn-ratio-of-value" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all duration-200 text-right text-slate-300 hover:bg-slate-800 dark:hover:bg-slate-900 hover:text-white">
                <span>📈</span> نسبة قيمة من قيمة أخرى
            </button>
            <button onclick="switchTab('percentage-increase')" id="btn-percentage-increase" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all duration-200 text-right text-slate-300 hover:bg-slate-800 dark:hover:bg-slate-900 hover:text-white">
                <span>➕</span> الزيادة بنسبة مئوية
            </button>
            <button onclick="switchTab('percentage-decrease')" id="btn-percentage-decrease" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all duration-200 text-right text-slate-300 hover:bg-slate-800 dark:hover:bg-slate-900 hover:text-white">
                <span>➖</span> النقصان بنسبة مئوية
            </button>
            <button onclick="switchTab('discount-price')" id="btn-discount-price" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all duration-200 text-right text-slate-300 hover:bg-slate-800 dark:hover:bg-slate-900 hover:text-white">
                <span>🏷️</span> السعر بعد الخصم
            </button>
            <button onclick="switchTab('fees-price')" id="btn-fees-price" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all duration-200 text-right text-slate-300 hover:bg-slate-800 dark:hover:bg-slate-900 hover:text-white">
                <span>💵</span> السعر بعد الرسوم والإضافات
            </button>
        </nav>
    </aside>

    <main class="flex-1 p-6 md:p-10 flex flex-col justify-between max-w-5xl mx-auto w-full">
        
        <div id="calculator-container" class="glass-card rounded-3xl p-6 md:p-8 shadow-xl transition-all duration-300">
            </div>

        <footer class="mt-8 text-center text-sm text-slate-500 dark:text-slate-400">
            لوحة تحكم النسب المئوية © 2026 | تعمل بالكامل بدون إنترنت (Offline)
        </footer>
    </main>

    <script>
        // قاعدة بيانات الواجهات والحاسبات المتاحة
        const calculators = {
            vat: {
                title: "حساب ضريبة القيمة المضافة مرنة المدخلات",
                desc: "قم بإدخال المبلغ الأساسي ونسبة الضريبة المطلوبة لحساب قيمة الضريبة والصافي الإجمالي.",
                inputs: [
                    { id: "vat-x", label: "المبلغ الأساسي (س)", placeholder: "مثال: 1000" },
                    { id: "vat-rate", label: "نسبة الضريبة (ص) %", placeholder: "مثال: 15" }
                ],
                calc: () => {
                    const x = parseFloat(document.getElementById('vat-x').value);
                    const rate = parseFloat(document.getElementById('vat-rate').value);
                    if (isNaN(x) || isNaN(rate)) return null;
                    const tax = x * (rate / 100);
                    const total = x + tax;
                    return {
                        result: total,
                        details: `قيمة الضريبة (${rate}%): <b>${formatNum(tax)}</b> | الصافي الإجمالي: <b>${formatNum(total)}</b>`
                    };
                }
            },
            'part-of-amount': {
                title: "معرفة قيمة النسبة من مبلغ",
                desc: "استخراج القيمة المالية المقابلة لنسبة مئوية معينة من مبلغ إجمالي.",
                inputs: [
                    { id: "part-x", label: "المبلغ الإجمالي (س)", placeholder: "مثال: 5000" },
                    { id: "part-y", label: "النسبة المئوية المطلوبة (ص) %", placeholder: "مثال: 20" }
                ],
                calc: () => {
                    const x = parseFloat(document.getElementById('part-x').value);
                    const y = parseFloat(document.getElementById('part-y').value);
                    if (isNaN(x) || isNaN(y)) return null;
                    return { result: x * (y / 100) };
                }
            },
            'change-rate': {
                title: "حساب نسبة التغير (الزيادة/النقصان)",
                desc: "معرفة الفارق المئوي وتحديد ما إذا كان صعوداً أم هبوطاً بين قيمتين.",
                inputs: [
                    { id: "change-x", label: "القيمة القديمة (س)", placeholder: "مثال: 200" },
                    { id: "change-y", label: "القيمة الجديدة (ص)", placeholder: "مثال: 250" }
                ],
                calc: () => {
                    const x = parseFloat(document.getElementById('change-x').value);
                    const y = parseFloat(document.getElementById('change-y').value);
                    if (isNaN(x) || isNaN(y) || x === 0) return null;
                    const diff = ((y - x) / x) * 100;
                    const isIncrease = diff >= 0;
                    const arrow = isIncrease ? '<span class="text-green-600 dark:text-green-400 font-bold">▲ زيادة</span>' : '<span class="text-red-600 dark:text-red-400 font-bold">▼ نقصان</span>';
                    return {
                        result: Math.abs(diff),
                        suffix: "%",
                        details: `نوع التغير: ${arrow} بمقدار <b>${formatNum(Math.abs(y - x))}</b>`
                    };
                }
            },
            'original-number': {
                title: "معرفة العدد الأصلي (قيمة أ هي ب٪ من؟)",
                desc: "البحث عن المبلغ الإجمالي الأساسي إذا كنت تعرف قيمة الجزء ونسبته المئوية.",
                inputs: [
                    { id: "orig-x", label: "الجزء (س)", placeholder: "مثال: 150" },
                    { id: "orig-y", label: "النسبة المئوية (ص) %", placeholder: "مثال: 15" }
                ],
                calc: () => {
                    const x = parseFloat(document.getElementById('orig-x').value);
                    const y = parseFloat(document.getElementById('orig-y').value);
                    if (isNaN(x) || isNaN(y) || y === 0) return null;
                    return { result: (x * 100) / y };
                }
            },
            'ratio-of-value': {
                title: "حساب نسبة قيمة من قيمة أخرى",
                desc: "استخراج النسبة المئوية التي يمثلها الجزء من الكل.",
                inputs: [
                    { id: "ratio-x", label: "الجزء (س)", placeholder: "مثال: 25" },
                    { id: "ratio-y", label: "الكل (ص)", placeholder: "مثال: 100" }
                ],
                calc: () => {
                    const x = parseFloat(document.getElementById('ratio-x').value);
                    const y = parseFloat(document.getElementById('ratio-y').value);
                    if (isNaN(x) || isNaN(y) || y === 0) return null;
                    return { result: (x / y) * 100, suffix: "%" };
                }
            },
            'percentage-increase': {
                title: "الزيادة بنسبة مئوية",
                desc: "إضافة نسبة مئوية محددة إلى المبلغ الأصلي مباشرة.",
                inputs: [
                    { id: "inc-x", label: "المبلغ الأصلي (س)", placeholder: "مثال: 1000" },
                    { id: "inc-y", label: "نسبة الزيادة (ص) %", placeholder: "مثال: 10" }
                ],
                calc: () => {
                    const x = parseFloat(document.getElementById('inc-x').value);
                    const y = parseFloat(document.getElementById('inc-y').value);
                    if (isNaN(x) || isNaN(y)) return null;
                    return { result: x + (x * (y / 100)) };
                }
            },
            'percentage-decrease': {
                title: "النقصان بنسبة مئوية",
                desc: "طرح نسبة مئوية محددة من المبلغ الأصلي.",
                inputs: [
                    { id: "dec-x", label: "المبلغ الأصلي (س)", placeholder: "مثال: 1000" },
                    { id: "dec-y", label: "نسبة النقصان (ص) %", placeholder: "مثال: 10" }
                ],
                calc: () => {
                    const x = parseFloat(document.getElementById('dec-x').value);
                    const y = parseFloat(document.getElementById('dec-y').value);
                    if (isNaN(x) || isNaN(y)) return null;
                    return { result: x - (x * (y / 100)) };
                }
            },
            'discount-price': {
                title: "السعر بعد الخصم",
                desc: "حساب السعر النهائي بعد تطبيق قسيمة أو نسبة خصم معينة ومعرفة الوفر الفعلي.",
                inputs: [
                    { id: "disc-x", label: "السعر قبل الخصم (س)", placeholder: "مثال: 800" },
                    { id: "disc-y", label: "نسبة الخصم (ص) %", placeholder: "مثال: 25" }
                ],
                calc: () => {
                    const x = parseFloat(document.getElementById('disc-x').value);
                    const y = parseFloat(document.getElementById('disc-y').value);
                    if (isNaN(x) || isNaN(y)) return null;
                    const finalPrice = x * ((100 - y) / 100);
                    const saved = x - finalPrice;
                    return {
                        result: finalPrice,
                        details: `المبلغ المخصوم الموفر: <b>${formatNum(saved)}</b>`
                    };
                }
            },
            'fees-price': {
                title: "السعر بعد الإضافات / الرسوم",
                desc: "معرفة السعر الكلي بعد إضافة رسوم إدارية أو مصاريف شحن مئوية.",
                inputs: [
                    { id: "fees-x", label: "السعر الأساسي (س)", placeholder: "مثال: 1200" },
                    { id: "fees-y", label: "نسبة الإضافة (ص) %", placeholder: "مثال: 5" }
                ],
                calc: () => {
                    const x = parseFloat(document.getElementById('fees-x').value);
                    const y = parseFloat(document.getElementById('fees-y').value);
                    if (isNaN(x) || isNaN(y)) return null;
                    const finalPrice = x * ((100 + y) / 100);
                    const added = finalPrice - x;
                    return {
                        result: finalPrice,
                        details: `قيمة المبلغ المضاف الزائد: <b>${formatNum(added)}</b>`
                    };
                }
            }
        };

        let currentTab = 'vat';
        let lastRawResult = '';

        function formatNum(num) {
            return new Intl.NumberFormat('en-US', { maximumFractionDigits: 2, minimumFractionDigits: 0 }).format(num);
        }

        // إدارة ميزة التبديل إلى الوضع الداكن / الفاتح
        function toggleDarkMode() {
            const html = document.documentElement;
            const btn = document.getElementById('theme-toggle-btn');
            
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                html.classList.add('light');
                btn.innerText = '🌙';
                localStorage.setItem('theme', 'light');
            } else {
                html.classList.remove('light');
                html.classList.add('dark');
                btn.innerText = '☀️';
                localStorage.setItem('theme', 'dark');
            }
        }

        // إعداد الوضع الافتراضي بناء على ذاكرة المتصفح
        function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            const html = document.documentElement;
            const btn = document.getElementById('theme-toggle-btn');
            
            if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                html.classList.add('dark');
                html.classList.remove('light');
                if(btn) btn.innerText = '☀️';
            } else {
                html.classList.add('light');
                html.classList.remove('dark');
                if(btn) btn.innerText = '🌙';
            }
        }

        function renderCalculator(tabKey) {
            const calc = calculators[tabKey];
            let inputsHtml = '';

            calc.inputs.forEach(input => {
                inputsHtml += `
                    <div class="flex flex-col gap-2">
                        <label class="font-medium text-slate-700 dark:text-slate-300" for="${input.id}">${input.label}</label>
                        <input type="number" id="${input.id}" placeholder="${input.placeholder}" 
                            class="w-full px-4 py-3 text-left rounded-xl border border-slate-300 dark:border-slate-700 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all duration-200 text-lg font-medium tracking-wide bg-white/70 dark:bg-slate-800/70 text-slate-900 dark:text-slate-100"
                            oninput="clearResultsOnly()">
                    </div>
                `;
            });

            const template = `
                <div class="mb-6">
                    <h2 class="text-2xl font-bold text-slate-900 dark:text-white mb-2">${calc.title}</h2>
                    <p class="text-slate-500 dark:text-slate-400 text-sm">${calc.desc}</p>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                    ${inputsHtml}
                </div>

                <div class="flex flex-wrap gap-3 mb-8">
                    <button onclick="executeCalculation()" class="px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-xl shadow-md transition-all duration-200 flex-1 md:flex-none">احسب</button>
                    <button onclick="clearFields()" class="px-6 py-3 bg-slate-200 hover:bg-slate-300 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 font-medium rounded-xl transition-all duration-200">مسح الحقول</button>
                </div>

                <div id="result-box" class="hidden p-6 rounded-2xl bg-gradient-to-br from-blue-50 to-indigo-50 dark:from-slate-800/60 dark:to-slate-800/90 border border-blue-100 dark:border-slate-700 transition-all duration-300 relative overflow-hidden">
                    <div class="text-sm font-medium text-blue-600 dark:text-blue-400 mb-1">النتيجة النهائية</div>
                    <div class="text-3xl font-bold text-slate-900 dark:text-white tracking-wide mb-3 flex items-center gap-2">
                        <span id="final-output" class="text-left font-sans">0</span>
                        <span id="output-suffix" class="text-lg text-slate-500 dark:text-slate-400"></span>
                    </div>
                    <div id="detailed-output" class="text-slate-600 dark:text-slate-300 text-sm border-t border-blue-100 dark:border-slate-700 pt-3 mt-1"></div>
                    
                    <button onclick="copyResult()" class="absolute top-4 left-4 p-2 bg-white dark:bg-slate-700 hover:bg-blue-100 dark:hover:bg-slate-600 text-blue-600 dark:text-blue-400 rounded-lg border border-blue-200 dark:border-slate-600 shadow-sm transition-all duration-200 text-sm flex items-center gap-1" title="نسخ النتيجة">
                        <span id="copy-icon">📋</span> <span id="copy-text">نسخ</span>
                    </button>
                </div>

                <div id="error-box" class="hidden p-4 rounded-xl bg-red-50 dark:bg-red-950/50 text-red-700 dark:text-red-400 border border-red-200 dark:border-red-900/50 text-sm font-medium transition-all duration-200"></div>
            `;

            document.getElementById('calculator-container').innerHTML = template;
            lastRawResult = '';
        }

        function switchTab(tabKey) {
            currentTab = tabKey;
            
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('bg-blue-600', 'text-white', 'font-medium', 'shadow-md');
                btn.classList.add('text-slate-300', 'hover:bg-slate-800', 'dark:hover:bg-slate-900', 'hover:text-white');
            });

            const activeBtn = document.getElementById(`btn-${tabKey}`);
            activeBtn.classList.remove('text-slate-300', 'hover:bg-slate-800', 'dark:hover:bg-slate-900', 'hover:text-white');
            activeBtn.classList.add('bg-blue-600', 'text-white', 'font-medium', 'shadow-md');

            renderCalculator(tabKey);
        }

        function executeCalculation() {
            const errorBox = document.getElementById('error-box');
            const resultBox = document.getElementById('result-box');
            
            errorBox.classList.add('hidden');
            resultBox.classList.add('hidden');

            const inputs = calculators[currentTab].inputs;
            for (let input of inputs) {
                const element = document.getElementById(input.id);
                if (element.value.trim() === '') {
                    showError('يرجى ملء جميع الحقول المطلوبة للمتابعة.');
                    return;
                }
            }

            if (currentTab === 'change-rate' && parseFloat(document.getElementById('change-x').value) === 0) {
                showError('خطأ رياضي: لا يمكن أن تكون القيمة القديمة صفراً.');
                return;
            }
            if ((currentTab === 'original-number' && parseFloat(document.getElementById('orig-y').value) === 0) ||
                (currentTab === 'ratio-of-value' && parseFloat(document.getElementById('ratio-y').value) === 0)) {
                showError('خطأ برمي/رياضي: لا يمكن القسمة على صفر في النسبة أو الكل.');
                return;
            }

            const data = calculators[currentTab].calc();
            
            if (data !== null) {
                lastRawResult = data.result.toFixed(2);
                
                document.getElementById('final-output').innerText = formatNum(data.result);
                document.getElementById('output-suffix').innerText = data.suffix || '';
                
                if (data.details) {
                    document.getElementById('detailed-output').innerHTML = data.details;
                    document.getElementById('detailed-output').classList.remove('hidden');
                } else {
                    document.getElementById('detailed-output').classList.add('hidden');
                }

                resultBox.classList.remove('hidden');
            } else {
                showError('تأكد من كتابة الأرقام بشكل صحيح وصيغة مقبولة.');
            }
        }

        function showError(message) {
            const errorBox = document.getElementById('error-box');
            errorBox.innerText = message;
            errorBox.classList.remove('hidden');
        }

        function clearFields() {
            calculators[currentTab].inputs.forEach(input => {
                document.getElementById(input.id).value = '';
            });
            clearResultsOnly();
        }

        function clearResultsOnly() {
            document.getElementById('result-box').classList.add('hidden');
            document.getElementById('error-box').classList.add('hidden');
            lastRawResult = '';
        }

        function copyResult() {
            if (!lastRawResult) return;
            
            navigator.clipboard.writeText(lastRawResult).then(() => {
                const copyText = document.getElementById('copy-text');
                const copyIcon = document.getElementById('copy-icon');
                
                copyText.innerText = 'تم النسخ!';
                copyIcon.innerText = '✅';
                
                setTimeout(() => {
                    copyText.innerText = 'نسخ';
                    copyIcon.innerText = '📋';
                }, 2000);
            }).catch(err => {
                alert('فشل نسخ النتيجة.');
            });
        }

        // تشغيل التهيئة عند تحميل الفحة لقراءة إعدادات النظام أو الذاكرة
        window.onload = () => {
            initTheme();
            switchTab('vat');
        };
    </script>
</body>
</html>
