<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مكتبة التطبيقات</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --badge-bg: rgba(59, 130, 246, 0.15);
      --badge-text: #60a5fa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 24px 16px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      width: 100%;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
      padding-top: 20px;
    }

    .logo-icon {
      width: 58px;
      height: 58px;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.4);
    }

    .logo-icon svg {
      width: 30px;
      height: 30px;
      color: #fff;
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 8px;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 1rem;
    }

    .pwa-tip {
      background: rgba(30, 41, 59, 0.7);
      border: 1px dashed var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .pwa-tip span {
      color: #38bdf8;
      font-weight: 700;
    }

    .search-row {
      display: flex;
      gap: 10px;
      margin-bottom: 32px;
    }

    .search-box {
      flex: 1;
    }

    .search-box input {
      width: 100%;
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 14px 18px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: var(--accent);
    }

    .refresh-btn {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 0 18px;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      transition: all 0.2s;
    }

    .refresh-btn:hover {
      color: #fff;
      border-color: var(--accent);
    }

    .apps-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .app-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s ease, border-color 0.2s ease;
      min-height: 190px;
    }

    .app-card:hover {
      transform: translateY(-4px);
      border-color: rgba(59, 130, 246, 0.5);
    }

    .app-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 12px;
    }

    .app-avatar {
      width: 46px;
      height: 46px;
      background-color: rgba(59, 130, 246, 0.1);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      flex-shrink: 0;
    }

    .app-title {
      font-size: 1.12rem;
      font-weight: 700;
      color: #fff;
    }

    .app-desc {
      color: var(--text-muted);
      font-size: 0.88rem;
      line-height: 1.5;
      margin-bottom: 16px;
      flex-grow: 1;
    }

    .app-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .tag {
      background-color: var(--badge-bg);
      color: var(--badge-text);
      font-size: 0.76rem;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 9999px;
    }

    .launch-btn {
      background-color: var(--accent);
      color: #fff;
      text-decoration: none;
      padding: 7px 15px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background-color 0.2s;
    }

    .launch-btn:hover {
      background-color: var(--accent-hover);
    }

    .status-msg {
      text-align: center;
      grid-column: 1 / -1;
      padding: 40px;
      color: var(--text-muted);
      font-size: 1rem;
    }

    footer {
      text-align: center;
      margin-top: auto;
      padding-top: 40px;
      color: var(--text-muted);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="logo-icon">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
        </svg>
      </div>
      <h1>مكتبة التطبيقات</h1>
      <p class="subtitle">بوابة الوصول المباشر إلى الأدوات والتطبيقات المخصصة</p>
    </header>

    <div class="pwa-tip">
      <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" style="flex-shrink:0;">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z" />
      </svg>
      <div>
        <span>نصيحة:</span> يمكنك تثبيت هذه المكتبة على هاتفك عبر خيار <strong>"إضافة إلى الشاشة الرئيسية"</strong> من قائمة المتصفح لتعمل كتطبيق مستقل.
      </div>
    </div>

    <div class="search-row">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="ابحث عن تطبيق..." onkeyup="filterApps()">
      </div>
      <button class="refresh-btn" onclick="fetchRepoApps(true)" title="تحديث قائمة التطبيقات">↻</button>
    </div>

    <div class="apps-grid" id="appsContainer">
      <div class="status-msg">جاري تحميل التطبيقات المتاحة...</div>
    </div>

    <footer>
      جميع الحقوق محفوظة &copy; 2026
    </footer>
  </div>

  <script>
    const REPO_OWNER = 'amakki99';
    const REPO_NAME = 'raff';

    // اختيار أيقونة مناسبة تلقائياً بناءً على اسم التطبيق
    function pickIcon(name) {
      const lower = name.toLowerCase();
      if (lower.includes('رف') || lower.includes('raff') || lower.includes('ملف')) return '🗂️';
      if (lower.includes('كيبورد') || lower.includes('اختصار') || lower.includes('shortcut')) return '⌨️';
      if (lower.includes('شات') || lower.includes('chat') || lower.includes('دردشة')) return '💬';
      if (lower.includes('حاسب') || lower.includes('calc')) return '🧮';
      if (lower.includes('ملاحظ') || lower.includes('note') || lower.includes('مهمة')) return '📝';
      if (lower.includes('تصميم') || lower.includes('خط') || lower.includes('فن')) return '🎨';
      return '⚡';
    }

    async function fetchRepoApps(forceRefresh = false) {
      const container = document.getElementById('appsContainer');
      const cacheKey = 'apps_catalog_cache';
      const cacheTimeKey = 'apps_catalog_time';

      // التحقق من وجود ذاكرة مؤقتة حديثة لتسريع الفتح
      if (!forceRefresh) {
        const cached = localStorage.getItem(cacheKey);
        const time = localStorage.getItem(cacheTimeKey);
        if (cached && time && (Date.now() - parseInt(time) < 1000 * 60 * 10)) {
          renderApps(JSON.parse(cached));
          return;
        }
      }

      container.innerHTML = '<div class="status-msg">جاري تحديث قائمة التطبيقات من المستودع...</div>';

      try {
        const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents`);
        if (!res.ok) throw new Error('تعذر الوصول للمستودع');
        const files = await res.json();

        // فلترة ملفات الـ HTML واستثناء الصفحة الرئيسية
        const htmlFiles = files.filter(f => 
          f.type === 'file' && 
          f.name.toLowerCase().endsWith('.html') && 
          f.name.toLowerCase() !== 'index.html'
        );

        const apps = await Promise.all(htmlFiles.map(async (file) => {
          let title = file.name.replace('.html', '');
          let desc = 'تطبيق ويب مستقل يعمل في المتصفح.';
          let tag = 'أداة';

          try {
            // قراءة العنوان والوصف مباشرة من داخل ملف الـ HTML
            const docRes = await fetch(encodeURIComponent(file.name));
            if (docRes.ok) {
              const htmlText = await docRes.text();
              const parser = new DOMParser();
              const doc = parser.parseFromString(htmlText, 'text/html');
              const docTitle = doc.querySelector('title')?.innerText;
              const docDesc = doc.querySelector('meta[name="description"]')?.content;
              if (docTitle) title = docTitle.replace(/[–|-].*$/, '').trim();
              if (docDesc) desc = docDesc;
            }
          } catch(e) {}

          return {
            title: title,
            url: file.name,
            desc: desc,
            tag: tag,
            icon: pickIcon(title + ' ' + file.name)
          };
        }));

        localStorage.setItem(cacheKey, JSON.stringify(apps));
        localStorage.setItem(cacheTimeKey, Date.now().toString());
        renderApps(apps);

      } catch (err) {
        const cached = localStorage.getItem(cacheKey);
        if (cached) {
          renderApps(JSON.parse(cached));
        } else {
          container.innerHTML = '<div class="status-msg">تعذر تحميل التطبيقات حالياً. تأكد من اتصال الإنترنت أو اضغط ↻ للتحديث.</div>';
        }
      }
    }

    function renderApps(apps) {
      const container = document.getElementById('appsContainer');
      if (!apps || apps.length === 0) {
        container.innerHTML = '<div class="status-msg">لا توجد تطبيقات إضافية حتى الآن.</div>';
        return;
      }

      container.innerHTML = apps.map(app => `
        <div class="app-card">
          <div>
            <div class="app-header">
              <div class="app-avatar">${app.icon}</div>
              <div class="app-title">${app.title}</div>
            </div>
            <p class="app-desc">${app.desc}</p>
          </div>
          <div class="app-footer">
            <span class="tag">${app.tag}</span>
            <a href="${encodeURI(app.url)}" class="launch-btn">فتح التطبيق ↗</a>
          </div>
        </div>
      `).join('');
    }

    function filterApps() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const cards = document.querySelectorAll('.app-card');
      cards.forEach(card => {
        const title = card.querySelector('.app-title')?.innerText.toLowerCase() || '';
        const desc = card.querySelector('.app-desc')?.innerText.toLowerCase() || '';
        if (title.includes(query) || desc.includes(query)) {
          card.style.display = 'flex';
        } else {
          card.style.display = 'none';
        }
      });
    }

    // التحميل المباشر عند فتح الصفحة
    fetchRepoApps();
  </script>
</body>
</html>
